name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Many color libraries just need this to be set to any value, but at least
  # one distinguishes color depth, where "3" -> "256-bit color".
  FORCE_COLOR: 3

jobs:
  pre-commit:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: "pip"
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --hook-stage manual --all-files

  test-apt:
    name: Test with Ubuntu casacore
    runs-on: ubuntu-latest
    needs: [pre-commit]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake casacore-dev libgsl-dev libboost-thread-dev

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: pip install "python-casacore>=3.6" "numpy>=2" pytest

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      # The regression tests compare every output with a build of main
      - name: Build main as the reference
        run: |
          git worktree add ../reference origin/main
          cmake -S ../reference -B ../reference-build -DCMAKE_BUILD_TYPE=Release
          cmake --build ../reference-build -j

      - name: Test
        env:
          CALIBRATE_BIN_DIR: build
          BASELINE_BIN_DIR: ../reference-build
        run: pytest -ra

  test-conda:
    name: Test with conda-forge casacore
    runs-on: ubuntu-latest
    needs: [pre-commit]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: calibrate
          create-args: >-
            python=3.12
            "casacore>=3.8"
            gsl
            libboost-devel
            cmake
            make
            cxx-compiler
            "python-casacore>=3.6"
            "numpy>=2"
            pytest
          cache-environment: true

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$CONDA_PREFIX"
          cmake --build build -j

      - name: Test
        env:
          CALIBRATE_BIN_DIR: build
        run: pytest -ra

  container:
    name: Build the Flint container
    runs-on: ubuntu-latest
    needs: [pre-commit]
    steps:
      # Same layout as flint-crew/flint-containers, where this repo is the
      # calibrate submodule and Dockerfile-calibrate builds the published image
      - uses: actions/checkout@v7
        with:
          path: calibrate

      - name: Get the flint-containers Dockerfile
        run: git clone --depth 1 https://github.com/flint-crew/flint-containers

      - name: Build
        run: docker build -f flint-containers/Dockerfile-calibrate -t calibrate-test .

      - name: Run the programs
        run: |
          set -o pipefail
          docker run --rm calibrate-test calibrate | grep "Usage: calibrate"
          docker run --rm calibrate-test applysolutions | grep "Usage: applysolutions"
          docker run --rm calibrate-test addmodel | grep "Usage: addmodel"
