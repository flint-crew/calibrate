# Configuration for the Python test suite in tests/. The programs themselves
# are built with CMake, see README.md.

[tool.ruff]
# Same settings as Flint (https://github.com/flint-crew/flint)
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
extend-select = [
    "I",        # isort
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
markers = ["slow: mark test as slow to run"]
